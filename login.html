
<!DOCTYPE html>
<html>
<head>
    <title>Shreesha Hostel Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: url('images/hostel_banner.png') no-repeat center center/cover;
            height: 75vh;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            background-position:center 100px;
        }

        .overlay {
            background: linear-gradient(135deg, rgba(15, 32, 80, 0.85), rgba(44, 83, 131, 0.75));
            height: 100vh;
            backdrop-filter: blur(1px);
        }

        /* Floating particles */
        .overlay::before,
        .overlay::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            animation: float 6s ease-in-out infinite;
        }

        .overlay::before {
            width: 300px;
            height: 300px;
            top: -50px;
            left: -100px;
        }

        .overlay::after {
            width: 200px;
            height: 200px;
            bottom: -60px;
            right: -80px;
            animation-delay: 3s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        /* Card */
        .login-card {
            background: rgba(255, 255, 255, 0.97);
            border-radius: 20px;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.3),
                0 0 0 1px rgba(255, 255, 255, 0.1);
            border: none;
            animation: slideUp 0.6s ease-out;
            position: relative;
            z-index: 10;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #4e73df, #36b9cc, #1cc88a);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Logo Section */
        .logo-section {
            padding: 10px 0 5px;
        }

        .logo-icon {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4e73df, #36b9cc);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            box-shadow: 0 8px 25px rgba(78, 115, 223, 0.35);
            animation: pulse 2s ease-in-out infinite;
        }

        .logo-icon i {
            font-size: 30px;
            color: #fff;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 8px 25px rgba(78, 115, 223, 0.35); }
            50% { box-shadow: 0 8px 35px rgba(78, 115, 223, 0.55); }
        }

        .logo-title {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #2c3e7a, #4e73df);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .logo-subtitle {
            font-size: 13px;
            color: #8a95a8;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Divider */
        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, #dde2ec, transparent);
            margin: 15px 0;
        }

        /* Form */
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 500;
            color: #4a5568;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .form-group label i {
            color: #4e73df;
            font-size: 12px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper .form-control {
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 12px 16px 12px 44px;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
            background: #f8fafc;
            color: #2d3748;
        }

        .input-wrapper .form-control:focus {
            border-color: #4e73df;
            box-shadow: 0 0 0 4px rgba(78, 115, 223, 0.1);
            background: #fff;
            outline: none;
        }

        .input-wrapper .form-control::placeholder {
            color: #a0aec0;
            font-size: 13px;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #a0aec0;
            font-size: 15px;
            transition: color 0.3s ease;
        }

        .input-wrapper:focus-within .input-icon {
            color: #4e73df;
        }

        /* Button */
        .btn-login {
            background: linear-gradient(135deg, #4e73df, #3657c3);
            border: none;
            border-radius: 12px;
            padding: 13px;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-login::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn-login:hover {
            background: linear-gradient(135deg, #3657c3, #2a46a8);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(78, 115, 223, 0.4);
        }

        .btn-login:hover::before {
            left: 100%;
        }

        .btn-login:active {
            transform: translateY(0);
            box-shadow: 0 4px 15px rgba(78, 115, 223, 0.3);
        }

        /* Error Alert */
        .error-alert {
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #fff5f5, #fee2e2);
            color: #c53030;
            font-size: 13px;
            font-weight: 500;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            animation: shake 0.5s ease-in-out;
        }

        .error-alert i {
            font-size: 16px;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        /* Footer */
        .login-footer {
            text-align: center;
            margin-top: 18px;
            padding-top: 15px;
            border-top: 1px solid #edf2f7;
        }

        .login-footer small {
            color: #a0aec0;
            font-size: 11px;
            letter-spacing: 0.5px;
        }

        .login-footer i {
            color: #4e73df;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .login-card {
                margin: 15px;
                width: calc(100% - 30px) !important;
            }
        }
    </style>
</head>

<body>

<div class="overlay d-flex justify-content-center align-items-center">

    <div class="card login-card p-4 px-4" style="width: 420px;">

        <!-- Logo Section -->
        <div class="logo-section text-center">
            <div class="logo-icon">
                <i class="fas fa-building"></i>
            </div>
            <div class="logo-title">Shreesha Hostel</div>
            <div class="logo-subtitle">Management System</div>
        </div>

        <div class="divider"></div>

        <!-- Form -->
        <form action="LoginServlet" method="post">

            <div class="form-group">
                <label><i class="fa fa-user"></i> Username</label>
                <div class="input-wrapper">
                    <i class="fa fa-user input-icon"></i>
                    <input type="text" name="username" class="form-control" placeholder="Enter your username" required>
                </div>
            </div>

            <div class="form-group">
                <label><i class="fa fa-lock"></i> Password</label>
                <div class="input-wrapper">
                    <i class="fa fa-lock input-icon"></i>
                    <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-login w-100">
                <i class="fa fa-sign-in-alt me-2"></i> Sign In
            </button>
            
            
            
            <!--
            <div class="text-center mt-3">
    <span style="font-size: 13px; color: #8a95a8;">
        New here?
    </span>
    <a href="register.jsp" style="
        color:#4e73df;
        font-weight:600;
        margin-left:5px;
        transition:0.3s;
    " onmouseover="this.style.textDecoration='underline'" 
      onmouseout="this.style.textDecoration='none'">
        Create Account
    </a>
</div>
            -->
           
        </form>

        <!-- Error Message -->
        <%
            String error = request.getParameter("error");
            if (error != null) {
        %>
            <div class="error-alert mt-3">
                <i class="fas fa-exclamation-circle"></i>
                Invalid Username or Password
            </div>
        <%
            }
        %>

        <!-- Footer -->
        <div class="login-footer">
            <small><i class="fas fa-shield-alt me-1"></i> Secure Login Portal</small>
        </div>

    </div>

</div>

</body>
</html>
